<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4d7e5"><title>程溪宁的魔法书 · 樱之约定</title><link rel="stylesheet" href="style.css"></head><body><div class="glimmer" aria-hidden="true"></div><header><span>SAKURA'S MAGIC BOOK</span><button class="small" onclick="help.showModal()" aria-label="玩法说明">?</button></header><main id="app"></main><nav id="nav"><button onclick="cover()">♧<span>魔法书</span></button><button onclick="letter()">♡<span>樱的来信</span></button><button onclick="album()">✧<span>卡牌图鉴</span></button></nav><dialog id="help"><h2>给小小魔法使</h2><p>打开书，读一读小樱的来信。选择一张卡牌，把打乱的英文字母按顺序拼好，就能将它收入魔法书。</p><p>点已填的字母可以撤回，也可以使用“看提示”。拼错没有关系，再试一次就好。集齐全部 12 张，专属庆典就会开启！</p><p class="muted">这是 12 张卡牌的同人插画版。进度只保存在当前浏览器。本次拼词收集使用新进度，不沿用旧试玩版。</p><button class="primary" onclick="help.close()">我知道啦</button></dialog><div id="live" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
